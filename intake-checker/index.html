<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intake Checker | Packard Toolkit</title>
    <link rel="icon" type="image/png" href="../settings/shared/favicon.png" />
    <link rel="stylesheet" href="../settings/shared/style.css" />
    <link rel="stylesheet" href="../settings/shared/footer.css" />
    <link rel="stylesheet" href="./intake-checker.css" />
  </head>
  <body data-page="intake">
    <div data-app-header></div>
    <div data-app-menu></div>
    <main class="app-shell intake-page">
      <section class="page-intro" aria-labelledby="pageTitle">
        <h1 id="pageTitle">Intake Checker</h1>
        <p class="subtitle">Paste a DeLorean intake, check it, and locate information that needs attention.</p>
      </section>
      <section class="panel intake-workspace" aria-label="Intake workspace">
        <div class="intake-input">
        <form id="intakeForm">
          <label for="intakeText">DeLorean intake text</label>
          <p id="intakeHelp">Processed only in this browser. Nothing is sent or saved.</p>
          <textarea id="intakeText" rows="12" spellcheck="false" autocomplete="off" aria-describedby="intakeHelp" placeholder="Paste the copied intake here"></textarea>
          <div class="intake-actions">
            <button class="primary-btn" type="submit">Check Intake</button>
            <button id="clearIntake" class="secondary-btn" type="button">Clear</button>
          </div>
        </form>
        <p id="intakeMessage" role="status" aria-live="polite"></p>
        </div>
        <section class="intake-output" aria-label="Intake results">
          <p id="intakeEmpty">Check an intake to see issues here.</p>
          <div id="intakeResults" hidden>
          <h2 id="resultsTitle">Intake results</h2>
          <dl id="intakeSummary"></dl>
          <section id="intakeReview" aria-labelledby="reviewTitle" hidden>
            <h2 id="reviewTitle">Review</h2>
            <div id="reviewClient"></div>
            <ul id="reviewItems"></ul>
            <p id="reviewEmpty">No additional review items</p>
          </section>
          <hr id="reviewDivider" hidden />
          <section id="validationReport" aria-labelledby="validationTitle">
            <h2 id="validationTitle">Validation report</h2>
            <p id="validationSummary" role="status"></p>
            <ol id="validationIssues"></ol>
          </section>
          </div>
        </section>
      </section>
    </main>
    <div data-app-footer></div>
    <script src="../settings/shared/settings-storage.js"></script>
    <script src="../settings/shared/app-shell.js"></script>
    <script type="module" src="./intake-checker.js"></script>
  </body>
</html>
