<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contract Splitter | Packard Toolkit</title>
  <link rel="icon" type="image/png" href="../shared/favicon.png" />
  <link rel="stylesheet" href="../shared/style.css" />
  <link rel="stylesheet" href="../shared/footer.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="contract-splitter">
  <div data-app-header></div><div data-app-menu></div>
  <main class="app-shell splitter-page">
    <section class="page-intro"><h1>Contract Splitter</h1><p class="subtitle">Choose contract PDFs to create pages 1–4, 5–7, 10, and 11.</p></section>
    <section class="splitter-upload panel" aria-label="Upload contracts">
      <label class="splitter-picker" for="contractFiles"><strong>Choose PDF contracts</strong><span>Select one or more files. Splitting starts automatically.</span></label>
      <input id="contractFiles" type="file" accept="application/pdf,.pdf" multiple aria-describedby="privacyNote" />
      <p id="privacyNote">Files stay in this browser tab. Nothing is uploaded or saved to an account.</p>
    </section>
    <section class="splitter-results" aria-labelledby="resultsTitle">
      <div class="splitter-heading"><div><h2 id="resultsTitle">Generated documents</h2><p id="splitterStatus" role="status" aria-live="polite">Choose contracts to begin.</p></div><button id="downloadAll" class="primary-btn" type="button" disabled>Download All (.zip)</button></div>
      <div id="contractResults"></div>
    </section>
  </main>
  <div data-app-footer data-app-version="Contract Splitter v1.0.0"></div>
  <script src="../shared/settings-storage.js"></script><script src="../shared/app-shell.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
